services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongodb_data:/data/db]
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: privai_guard
      JWT_SECRET: change-this-in-production
      CORS_ORIGINS: http://localhost:5173
      LLM_PROVIDER: mock
      TRANSFORMER_ENABLED: "false"
    ports: ["8000:8000"]
    depends_on: [mongodb]
  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  mongodb_data:
